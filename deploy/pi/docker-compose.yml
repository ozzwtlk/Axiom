# AXIOM server on the Raspberry Pi, using an image built on the PC (`./axiom ship-server pi@<pi-address>`).
# Nothing is built here. Needs a .env next to this file (AXIOM_TOKEN, optional AXIOM_PORT / AXIOM_DATA).
#   docker compose up -d        → http://<pi-address>:8080
services:
  axiom:
    image: axiom-server:latest
    pull_policy: never          # the image comes from `docker load`, not from a registry
    container_name: axiom
    restart: unless-stopped
    ports:
      - "${AXIOM_PORT:-8080}:8000"
    environment:
      AXIOM_TOKEN: ${AXIOM_TOKEN:?set AXIOM_TOKEN in .env (at least 16 characters)}
    volumes:
      - ${AXIOM_DATA:-./server-data}:/data
